<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias | Lytiks</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://lytiks.solutions/gracias.html">
<style>
:root{
  --navy:#102e4a;
  --blue:#5888b2;
  --off:#f7f6f3;
  --ink:#0d1b2a;
  --body:#374151;
  --rule:#e5e7eb;
  --serif:'Georgia',serif;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:1.5rem;
  background:
    radial-gradient(circle at top right, rgba(88,136,178,.16), transparent 28%),
    linear-gradient(180deg, #ffffff 0%, var(--off) 100%);
  color:var(--body);
  font-family:var(--sans);
}
.card{
  width:min(100%, 720px);
  background:rgba(255,255,255,.9);
  border:1px solid var(--rule);
  border-radius:18px;
  padding:3rem;
  box-shadow:0 30px 80px rgba(16,46,74,.12);
}
.eyebrow{
  font-size:.75rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--blue);
  font-weight:700;
}
h1{
  margin-top:1rem;
  font-family:var(--serif);
  font-size:clamp(2.4rem, 6vw, 4rem);
  line-height:1.05;
  color:var(--ink);
}
p{
  margin-top:1rem;
  max-width:42ch;
  line-height:1.7;
}
.actions{
  display:flex;
  gap:.8rem;
  flex-wrap:wrap;
  margin-top:2rem;
}
.actions a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:.85rem 1.2rem;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
}
p a{
  color:var(--navy);
  font-weight:700;
}
.primary{
  background:var(--navy);
  color:#fff;
}
.secondary{
  color:var(--navy);
  border:1px solid rgba(16,46,74,.18);
}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Mensaje recibido</div>
    <h1>Gracias por escribirnos.</h1>
    <p>Recibimos tu mensaje y el equipo de Lytiks te respondera en menos de 24 horas. Mientras tanto, puedes volver al sitio o escribir directamente a <a href="mailto:info@lytiks.ai">info@lytiks.ai</a>.</p>
    <div class="actions">
      <a class="primary" href="./">Volver al inicio</a>
      <a class="secondary" href="mailto:info@lytiks.ai">Enviar correo</a>
    </div>
  </main>
</body>
</html>
